services:
  elearning:
    image: elearning-backend:latest
    container_name: elearning-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in server/.env}"
    volumes:
      - ../../uploads:/app/uploads
      - ../../data:/app/data
    depends_on:
      redis:
        condition: service_healthy
