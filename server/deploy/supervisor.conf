; ============================================================
; E-Learning Supervisor 守护进程配置
; 使用方式:
;   1. 复制到 /etc/supervisor/conf.d/elearning.conf
;   2. supervisorctl reread
;   3. supervisorctl update
;   4. supervisorctl start elearning
; ============================================================

[program:elearning]
; 项目路径 — 根据实际部署位置修改
directory=/www/wwwroot/elearning/server
command=/www/wwwroot/elearning/server/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --timeout-keep-alive 120

; 进程管理
user=root
autostart=true              ; 机器启动时自动启动
autorestart=true            ; 崩溃后自动重启
startsecs=10                ; 启动后等 10 秒再判定是否成功
startretries=3              ; 最大重试 3 次
stopasgroup=true            ; 停整个进程组
killasgroup=true            ; 杀整个进程组

; 环境变量
environment=PATH="/www/wwwroot/elearning/server/venv/bin"

; 日志配置
stdout_logfile=/www/wwwroot/elearning/server/logs/uvicorn.log
stderr_logfile=/www/wwwroot/elearning/server/logs/uvicorn.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_backups=5

; 日志级别 (debug, info, warning, error, critical)
loglevel=info
